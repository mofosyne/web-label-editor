<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Label Editor</title>
  <meta name="description" content="Design labels and print them straight to DYMO LabelWriter and Brother P-touch printers from the browser, including continuous rolls.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Web Label Editor</h1>
    <div class="conn">
      <span id="conn-status" class="pill">Not connected</span>
    </div>
    <div class="actions">
      <label class="copies">Copies <input id="copies" type="number" min="1" max="99" value="1"></label>
      <button id="btn-print" class="primary" disabled>Print</button>
      <button id="btn-png">Download PNG</button>
      <button id="btn-save">Save</button>
      <button id="btn-labels">My labels</button>
      <button id="btn-help">Help</button>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <main class="layout">
    <aside class="panel" id="setup">
      <h2>Printer</h2>
      <label>Model
        <select id="printer"></select>
      </label>
      <label>Media
        <select id="medium"></select>
      </label>
      <a id="request-label" class="small-link" target="_blank" rel="noopener">Missing a label size? Request it</a>
      <div id="lanes-box" hidden>
        <label>Labels in a row <select id="row-mode"></select></label>
        <p id="lanes-note" class="note"></p>
      </div>
      <div class="row" id="connect-buttons"></div>
      <button id="btn-detect" hidden>Detect loaded tape</button>
      <button id="btn-usb-help" class="link">USB setup help</button>
      <div id="model-options"></div>
      <p id="model-note" class="note"></p>
      <p class="note"><a id="report-printer" target="_blank" rel="noopener"></a></p>

      <details id="adjust-box" class="section">
        <summary><h2>Test prints &amp; position</h2> <span id="adjust-state" class="state"></span></summary>
        <div id="adjust"></div>
      </details>

      <h2>Length</h2>
      <div id="length-controls">
        <label class="inline"><input type="radio" name="lenmode" value="auto"> Fit to content</label>
        <label class="inline"><input type="radio" name="lenmode" value="fixed"> Fixed</label>
        <label>Length (mm) <input id="len-mm" type="number" min="5" step="1"></label>
        <label>End padding (mm) <input id="pad-mm" type="number" min="0" step="0.5"></label>
      </div>
      <p id="length-fixed-note" class="note" hidden>Die-cut labels have a fixed length.</p>

      <h2>Label</h2>
      <label class="inline"><input id="border" type="checkbox"> Border</label>
      <label class="inline"><input id="invert" type="checkbox"> Invert (white on black)</label>
      <label id="bleed-box" hidden>Overprint past the label edge
        <select id="bleed">
          <option value="0">Off</option>
          <option value="0.5">0.5 mm</option>
          <option value="1">1 mm</option>
          <option value="1.5">1.5 mm</option>
          <option value="2">2 mm</option>
        </select>
      </label>

      <h2>Design</h2>
      <p id="lib-current" class="note" hidden></p>
      <div class="row">
        <button id="btn-lib-save">Save to My labels</button>
        <button id="btn-lib-saveas">Save as new…</button>
        <button id="btn-lib-open">My labels &amp; history</button>
      </div>
      <div class="row">
        <button id="btn-export">Save file…</button>
        <button id="btn-import">Open file…</button>
        <input id="import-file" type="file" accept="application/json,.json" hidden>
      </div>
      <button id="btn-new" class="danger-link">New design</button>
    </aside>

    <section class="stage">
      <div class="toolbar">
        <button id="add-text">+ Text</button>
        <button id="add-image">+ Image</button>
        <button id="add-box">+ Box</button>
        <button id="add-qr">+ QR code</button>
        <button id="add-barcode">+ Barcode</button>
        <button id="btn-batch" title="Print a batch: one label per row of a spreadsheet or list, numbered or dated">Batch…</button>
        <input id="image-file" type="file" accept="image/*" hidden>
        <span class="spacer"></span>
        <span class="tools">
        <span class="seg" role="group" aria-label="Orientation">
          <button class="icon" data-orient="landscape" title="Landscape: the label lying along the feed" aria-label="Landscape">▭</button>
          <button class="icon" data-orient="portrait" title="Portrait: the label standing upright" aria-label="Portrait">▯</button>
        </span>
        <button id="undo" class="icon" aria-label="Undo" title="Undo (Ctrl+Z)">↶</button>
        <button id="redo" class="icon" aria-label="Redo" title="Redo (Ctrl+Shift+Z)">↷</button>
        <button id="zoom-out" class="icon" aria-label="Zoom out">−</button>
        <span id="zoom-label">100%</span>
        <button id="zoom-in" class="icon" aria-label="Zoom in">+</button>
        <button id="zoom-actual" class="icon" aria-label="Actual size">1:1</button>
        </span>
      </div>
      <div class="canvas-wrap" id="canvas-wrap">
        <div class="ruled">
          <span class="ruler-corner">mm</span>
          <canvas id="ruler-top" class="ruler" aria-hidden="true"></canvas>
          <canvas id="ruler-left" class="ruler" aria-hidden="true"></canvas>
          <canvas id="canvas" tabindex="0" aria-label="Label preview"></canvas>
        </div>
        <div id="lane-buttons"></div>
      </div>
      <figure id="actual-wrap" class="actual-wrap" hidden>
        <figcaption><span id="actual-title">Actual size</span>
          <button id="btn-recalibrate" type="button" class="linklike">Recalibrate…</button>
          <button id="btn-hide-actual" type="button" class="linklike">Hide</button></figcaption>
        <canvas id="actual-canvas" aria-label="The label at its real size"></canvas>
      </figure>
      <p id="dims" class="dims"></p>
      <div id="data-bar" class="data-bar" hidden></div>
      <input id="data-file" type="file" accept=".csv,.tsv,.md,.markdown,.json,.rec,.txt,text/csv,application/json,text/markdown,text/plain" hidden>
      <p class="hint">Click text to edit it · drag to move · double-click empty space to add text ·
        <button id="btn-shortcuts" type="button" class="linklike">Shortcuts and tips</button></p>
    </section>

    <aside class="panel" id="props">
      <h2>Items</h2>
      <ol id="item-list" class="item-list"></ol>
      <div id="item-props"></div>
    </aside>
  </main>

  <dialog id="help-dialog" class="help" aria-label="Printer connection help"></dialog>
  <dialog id="about-dialog" class="help about" aria-label="Welcome and help"></dialog>
  <dialog id="library-dialog" class="help about library" aria-label="My labels and print history"></dialog>
  <dialog id="screen-dialog" class="help screen" aria-label="Calibrate the screen for actual size"></dialog>

  <script type="module" src="src/app.js"></script>
</body>
</html>
