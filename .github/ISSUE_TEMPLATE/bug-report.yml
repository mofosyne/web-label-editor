name: Bug report
description: Something in the editor doesn't work as expected.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: system
    attributes:
      label: Operating system, browser and printer
      description: e.g. "Windows 11, Edge 130, Brother PT-P710BT over Bluetooth"
